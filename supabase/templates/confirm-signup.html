<!-- Supabase: Authentication > Emails > Templates > Confirm signup.
     Sent instead of the magic link the first time someone signs in with an email.
     Subject: Confirm your email for SOS -->
<div style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:560px;margin:0 auto;padding:24px;color:#111">
  <h1 style="font-size:20px;margin:0 0 16px">Welcome to SOS</h1>
  <p style="font-size:15px;line-height:1.5">Confirm your email to finish signing in. The link works once.</p>
  <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#111;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none">Confirm and sign in</a></p>
  <p style="font-size:13px;color:#666;line-height:1.5">If you didn't sign up for SOS, you can ignore this email.</p>
</div>
