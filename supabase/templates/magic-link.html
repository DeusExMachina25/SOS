<!-- Supabase: Authentication > Emails > Templates > Magic Link.
     Subject: Your SOS sign-in link -->
<div style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:560px;margin:0 auto;padding:24px;color:#111">
  <h1 style="font-size:20px;margin:0 0 16px">Sign in to SOS</h1>
  <p style="font-size:15px;line-height:1.5">Tap the button to sign in. The link works once.</p>
  <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#111;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none">Sign in</a></p>
  <p style="font-size:13px;color:#666;line-height:1.5">If you didn't ask to sign in, you can ignore this email. Nobody can get into your account without this link.</p>
</div>
